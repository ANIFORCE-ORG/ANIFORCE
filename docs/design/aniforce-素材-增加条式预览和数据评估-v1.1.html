function renderPreview(a){if(!a){E.preview.innerHTML='<div class="empty"><svg class="ico"><use href="#i-media"></use></svg><strong>暂无选中素材</strong></div>';E.preview.classList.remove("open");E.backdrop.hidden=true;return}E.preview.innerHTML=`<div class="preview-inner"><div class="preview-top"><div class="preview-title"><h2>${esc(a.name)}</h2><p>${esc(a.id)} · ${a.kind==="video"?"视频素材":"图片素材"}</p></div><button class="preview-close" type="button" data-close-detail aria-label="关闭详情">×</button></div><div class="preview-actions"><span class="status ${cls(a.status)}">${esc(a.status)}</span><button class="btn soft" type="button" data-copy="${esc(a.id)}"><svg class="ico"><use href="#i-copy"></use></svg>复制 ID</button><button class="btn" type="button" data-stage="${esc(a.id)}"><svg class="ico"><use href="#i-add"></use></svg>加入待投放</button></div>${previewMedia(a)}<section class="section"><div class="section-head"><span>核心表现</span><span>${esc(a.campaign)}</span></div><div class="detail-metrics"><div class="detail-metric"><span>消耗</span><b>${esc(a.spend)}</b></div><div class="detail-metric"><span>曝光</span><b>${fmtNum(a.impressions)}</b></div><div class="detail-metric"><span>点击</span><b>${fmtNum(a.clicks)}</b></div><div class="detail-metric"><span>CTR</span><b class="${metricClass(a.ctr)}">${esc(a.ctr)}</b></div><div class="detail-metric"><span>CVR</span><b>${esc(a.cvr)}</b></div><div class="detail-metric"><span>ROAS</span><b class="${a.roas!=="-"&&parseFloat(a.roas)>=2.5?"positive":"warning"}">${esc(a.roas)}</b></div></div></section><section class="section"><div class="section-head"><span>基础信息</span><span>${esc(a.review)}</span></div><div class="info-grid">${info("素材类型",a.kind==="video"?"视频":"图片")}${info("尺寸 / 比例",`${a.dim} / ${a.ratio}`)}${info("来源",a.source)}${info("创建人",a.creator)}${info("上传时间",a.time)}${info("文件格式",a.fmt)}${info("文件大小",a.size)}${info("时长",a.duration)}${info("来源账号",a.account)}${info("授权",a.rights)}${info("绑定计划",a.plan)}${info("疲劳度",`${a.fatigue}%`)}</div></section><section class="section"><div class="section-head"><span>平台与版位</span><span>${esc(a.platforms.join(" / "))}</span></div><div class="places">${a.places.map(p=>`<div class="place"><span>${esc(p)}</span><svg class="ico"><use href="#i-check"></use></svg></div>`).join("")}</div></section><section class="section"><div class="section-head"><span>标签</span><span>Score ${a.score}</span></div><div class="tags">${a.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></section></div>`;E.preview.classList.toggle("open",state.detail);E.backdrop.hidden=!state.detail}
function render(){const list=rows();E.results.className="asset-table";renderOverview(list);renderAnalysis(list);if(!list.length){E.results.innerHTML="";E.empty.hidden=false;E.count.textContent="0 个素材";renderPreview(null);return}if(!list.some(a=>a.id===state.selected))state.selected=list[0].id;renderTable(list);E.empty.hidden=true;E.count.textContent=`${list.length} 个素材`;renderPreview(list.find(a=>a.id===state.selected)||assets.find(a=>a.id===state.selected));}
function toast(msg){E.toast.textContent=msg;E.toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>E.toast.classList.remove("show"),2200)}
function humanSize(bytes){if(!bytes)return"0 KB";const u=["B","KB","MB","GB"];let v=bytes,i=0;while(v>=1024&&i<u.length-1){v/=1024;i++}return `${v.toFixed(i?1:0)} ${u[i]}`}function ratioFrom(w,h){if(!w||!h)return"未知";const r=w/h;if(Math.abs(r-9/16)<.04)return"9:16";if(Math.abs(r-1)<.04)return"1:1";if(Math.abs(r-4/5)<.04)return"4:5";if(Math.abs(r-16/9)<.05)return"16:9";if(Math.abs(r-1.91)<.06)return"1.91:1";return `${w}:${h}`}
function clean(n){return n.replace(/\.[^.]+$/," ").trim().replace(/\s+/g,"_")}
function addFile(file){const kind=file.type.startsWith("video/")?"video":"image",url=URL.createObjectURL(file),time=new Date().toLocaleString("zh-CN",{hour12:false}).replace(/\//g,"-");const asset={id:`mat_${Date.now()}_${Math.random().toString(16).slice(2,7)}`,name:clean(file.name),kind,fmt:(file.name.split(".").pop()||file.type.split("/").pop()||"FILE").toUpperCase(),dim:"解析中",ratio:"未知",source:"本地上传",creator:"小陈",time:time.slice(0,16),platforms:["Meta","TikTok","Facebook"],status:"审核中",review:"待提交平台审核",account:"本地浏览器上传",size:humanSize(file.size),duration:kind==="video"?"解析中":"-",tags:["新上传",kind==="video"?"Video":"Image"],campaign:"待绑定 Campaign",plan:"待绑定计划",objective:"待配置",places:kind==="video"?["Reels","Stories","TikTok In-Feed"]:["Feed","Stories","Marketplace"],spend:"$0",ctr:"-",cvr:"-",roas:"-",score:70,fatigue:0,last:time.slice(0,16),rights:"本地上传",tone:"slate",thumb:kind==="video"?"":url,src:url,spendValue:0,impressions:0,clicks:0,conversions:0,revenue:0,cpm:0,cpc:0};if(kind==="video")asset.thumb=art(asset);assets.unshift(asset);state.selected=asset.id;render();if(kind==="image"){const img=new Image();img.onload=()=>{asset.dim=`${img.naturalWidth}x${img.naturalHeight}`;asset.ratio=ratioFrom(img.naturalWidth,img.naturalHeight);render()};img.src=url}else{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>{const m=Math.floor(v.duration/60),s=Math.floor(v.duration%60).toString().padStart(2,"0");asset.dim=`${v.videoWidth}x${v.videoHeight}`;asset.ratio=ratioFrom(v.videoWidth,v.videoHeight);asset.duration=`${m.toString().padStart(2,"0")}:${s}`;asset.thumb=art(asset);render()};v.src=url}}
function csv(){const list=rows(),head=["素材ID","素材名称","类型","尺寸","比例","来源","创建人","上传时间","平台","状态","审核","消耗","曝光","点击","评分","疲劳度","CTR","CVR","ROAS","绑定计划"],body=list.map(a=>[a.id,a.name,a.kind==="video"?"视频":"图片",a.dim,a.ratio,a.source,a.creator,a.time,a.platforms.join(" / "),a.status,a.review,a.spend,fmtNum(a.impressions),fmtNum(a.clicks),a.score,`${a.fatigue}%`,a.ctr,a.cvr,a.roas,a.plan]);const out=[head,...body].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");const blob=new Blob(["\ufeff"+out],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="aniforce_creative_assets.csv";a.click();URL.revokeObjectURL(url);toast("已导出当前筛选素材清单")}
function update(){state.q=E.q.value;state.platform=E.platform.value;state.source=E.source.value;state.status=E.status.value;state.ratio=E.ratio.value;state.metric=E.metric.value;state.sort=E.sort.value;state.customStart=E.dateStart.value;state.customEnd=E.dateEnd.value;render()}
function closeDetail(){state.detail=false;renderPreview(assets.find(a=>a.id===state.selected))}
E.q.addEventListener("input",update);[E.platform,E.source,E.status,E.ratio,E.metric,E.sort,E.dateStart,E.dateEnd].forEach(el=>el.addEventListener("change",update));[E.dateStart,E.dateEnd].forEach(el=>el.addEventListener("input",update));E.period.addEventListener("click",e=>{const b=e.target.closest("button[data-period]");if(!b)return;state.period=b.dataset.period;state.customStart="";state.customEnd="";E.dateStart.value="";E.dateEnd.value="";E.period.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});E.analysisRefresh.addEventListener("click",()=>{renderAnalysis(rows());toast("已基于当前周期重新生成分析")});E.resetBtn.addEventListener("click",()=>{E.q.value="";[E.platform,E.source,E.status,E.ratio,E.metric].forEach(el=>el.value="all");E.sort.value="spend";E.dateStart.value="";E.dateEnd.value="";state.type="all";state.period="7";state.customStart="";state.customEnd="";E.period.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.period==="7"));E.type.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.type==="all"));update();toast("筛选条件已重置")});E.type.addEventListener("click",e=>{const b=e.target.closest("button[data-type]");if(!b)return;state.type=b.dataset.type;E.type.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});E.results.addEventListener("click",e=>{const node=e.target.closest("[data-id]");if(node){e.preventDefault();state.selected=node.dataset.id;state.detail=true;render()}});E.results.addEventListener("keydown",e=>{if((e.key!=="Enter"&&e.key!==" ")||!e.target.closest("[data-id]"))return;e.preventDefault();state.selected=e.target.closest("[data-id]").dataset.id;state.detail=true;render()});E.uploadBtn.addEventListener("click",()=>E.file.click());E.file.addEventListener("change",()=>{Array.from(E.file.files||[]).filter(f=>f.type.startsWith("image/")||f.type.startsWith("video/")).forEach(addFile);E.file.value="";toast("素材已加入本地素材库")});E.exportBtn.addEventListener("click",csv);E.syncBtn.addEventListener("click",()=>toast("已模拟同步 Meta、TikTok、Facebook 审核状态"));E.backdrop.addEventListener("click",closeDetail);document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.detail)closeDetail()});E.preview.addEventListener("click",async e=>{if(e.target.closest("[data-close-detail]")){closeDetail();return}const c=e.target.closest("[data-copy]"),s=e.target.closest("[data-stage]");if(c){try{await navigator.clipboard.writeText(c.dataset.copy);toast("素材 ID 已复制")}catch{toast(`素材 ID：${c.dataset.copy}`)}}if(s)toast("已加入待投放素材队列")});render()})();
</script>
</body>
