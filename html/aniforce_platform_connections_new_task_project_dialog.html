    function promptDeleteSelectedPlans(projectId) {
      const project = projects.find(item => item.id === projectId);
      if (!project) return;
      const selectedIds = Array.from(document.querySelectorAll("[data-copy-plan]:checked")).map(el => el.dataset.copyPlan);
      const selectedTasks = (project.tasks || []).filter(task => selectedIds.includes(task.id));
      if (!selectedTasks.length) {
        showToast("请先选择要删除的计划");
        return;
      }
      openConfirmDelete(
        "确认批量删除计划",
        `将删除 ${selectedTasks.length} 个计划，对应任务条目和计划素材配置会一并移除。`,
        { type: "plans", projectId, ids: selectedTasks.map(task => task.id) }
      );
    }

    function confirmPendingDelete() {
      const pending = state.pendingDelete || (state.deleteId ? { type: "connection", id: state.deleteId } : null);
      if (!pending) return;

      if (pending.type === "projects") {
        const selected = new Set(pending.ids);
        const deletedCount = projects.filter(project => selected.has(project.id)).length;
        projects.splice(0, projects.length, ...projects.filter(project => !selected.has(project.id)));
        state.projectSubview = "list";
        state.activeProjectId = null;
        state.activeTaskId = null;
        state.pendingDelete = null;
        state.deleteId = null;
        document.getElementById("confirmModal").classList.remove("active");
        renderProjectsPage();
        showToast(`已删除 ${deletedCount} 个项目`);
        return;
      }

      if (pending.type === "plans") {
        const project = projects.find(item => item.id === pending.projectId);
        const selected = new Set(pending.ids);
        const deletedTasks = (project?.tasks || []).filter(task => selected.has(task.id));
        const deletedAdsetIds = new Set(deletedTasks.map(task => task.adsetId).filter(Boolean));
        if (project) {
          project.tasks = (project.tasks || []).filter(task => !selected.has(task.id));
          project.adsets = (project.adsets || []).filter(adset => !deletedAdsetIds.has(adset.id));
          adjustProjectPlanCount(project, -deletedTasks.length);
        }
        state.projectSubview = "tasks";
        state.activeProjectId = pending.projectId;
        state.activeTaskId = null;
        state.pendingDelete = null;
        state.deleteId = null;
        document.getElementById("confirmModal").classList.remove("active");
        renderProjectsPage();
        showToast(`已删除 ${deletedTasks.length} 个计划`);
        return;
      }

      state.connections = state.connections.filter(c => c.id !== pending.id);
      state.deleteId = null;
      state.pendingDelete = null;
      document.getElementById("confirmModal").classList.remove("active");
      renderPlatformPage();
      showToast("连接已删除");
    }

    function openProjectForm(projectId) {
      const project = projectId ? projects.find(item => item.id === projectId) : null;
      const channel = getProjectChannel(project) || "Meta";
      const campaign = getProjectCampaign(project);
      state.editingProjectId = project?.id || null;
      state.projectFormChannel = channel;
      document.getElementById("projectModalTitle").textContent = project ? `编辑 ${channel} 项目` : "新建投放项目";
      document.getElementById("projectModalHint").textContent = project ? `正在编辑 ${project.name}` : "项目对应渠道 Campaign 层级";
      document.getElementById("projectModalBody").innerHTML = renderProjectForm(project, campaign);
      document.getElementById("projectModal").classList.add("active");
    }

    function renderProjectForm(project, campaign) {
      const channel = state.projectFormChannel || getProjectChannel(project);
      const ui = getChannelUi(channel);
      return `
        <div class="project-note"><strong>${escapeHtml(ui.campaignTitle)} 框架</strong><br>项目对应 ${escapeHtml(ui.campaignTitle)} 层级；下层计划对应 ${escapeHtml(ui.planTitle)}，素材对应 ${escapeHtml(ui.creativeTitle)}。这里配置项目归属与 Campaign 字段。</div>
        <div class="form-grid">
          ${renderFormSelect("投放渠道", "channel", ["Meta", "Google", "TikTok"], channel, "data-project-channel")}
          ${renderFormInput("项目名称", "name", project?.name || "", "例如 CB_US_Meta_AppPromotion")}
          ${renderFormInput("产品", "product", project?.product || "", "例如 休闲消除手游")}
          ${renderFormInput("投放国家", "countries", project?.countries?.join(" / ") || "", "例如 美国 / 加拿大")}
          ${renderFormInput("广告账户", "account", campaign.account || defaultAccountForChannel(channel), `${channel} Account ID`)}
          ${renderFormInput("Campaign 名称", "campaignName", campaign.campaignName || "", `${channel} Campaign Name`)}
          ${renderFormSelect(ui.objectiveLabel, "objective", ui.objectiveOptions, campaign.objective || ui.objectiveOptions[0])}
          ${renderFormSelect(ui.buyingLabel, "buyingType", ui.buyingOptions, campaign.buyingType || ui.buyingOptions[0])}
          ${renderFormSelect(ui.categoryLabel, "specialAdCategories", ui.categoryOptions, campaign.specialAdCategories || ui.categoryOptions[0])}
          ${renderFormSelect("A/B test", "abTest", ["关闭", "开启"], campaign.abTest || "关闭")}
          ${renderFormSelect(ui.budgetSwitchLabel, "campaignBudget", ["开启", "关闭"], campaign.campaignBudget || "开启")}
          ${renderFormSelect("状态", "campaignStatus", ui.statusOptions, campaign.campaignStatus || ui.statusOptions[0])}
          ${renderFormSelect("Budget type", "budgetType", ["Daily budget", "Lifetime budget"], campaign.budgetType || "Daily budget")}
          ${renderFormInput("daily/lifetime budget", "budget", campaign.budget || "", "例如 800 USD")}
          ${renderFormSelect("bid strategy", "bidStrategy", ui.bidOptions, campaign.bidStrategy || ui.bidOptions[0])}
          ${renderFormInput("spend limit", "spendLimit", campaign.spendLimit || "", "例如 18,000 USD")}
          ${renderFormInput("start", "start", campaign.start || "", "例如 2026-06-01 10:00")}
          ${renderFormInput("end", "end", campaign.end || "", "例如 2026-06-30 23:00")}
        </div>
      `;
    }

    function renderFormInput(label, field, value, placeholder) {
      return `<div class="field"><label>${label}</label><input data-project-field="${field}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" /></div>`;
    }

    function renderFormSelect(label, field, options, selected, extraAttr = "") {
      return `
        <div class="field">
          <label>${label}</label>
          <select data-project-field="${field}" ${extraAttr}>
            ${options.map(option => `<option value="${escapeHtml(option)}" ${option === selected ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function defaultAccountForChannel(channel) {
      if (channel === "Google") return "MCC-602-884-1022";
      if (channel === "TikTok") return "tt_ads_8302019";
      return "act_2194875301";
    }

    function saveProjectConfig() {
      const values = {};
      document.querySelectorAll("[data-project-field]").forEach(el => {
        values[el.dataset.projectField] = el.value.trim();
      });
      if (!values.name) { showToast("请填写项目名称"); return; }

      let project = state.editingProjectId ? projects.find(item => item.id === state.editingProjectId) : null;
      if (!project) {
        project = {
          id: `${(values.channel || "meta").toLowerCase()}-project-${Date.now()}`,
          name: values.name,
          channel: values.channel || "Meta",
          aliases: [values.name.toLowerCase()],
          product: values.product || "未填写产品",
          countries: splitProjectCountries(values.countries),
          status: mapCampaignStatus(values.campaignStatus),
          plans: "0 个计划",
          adsets: [],
          tasks: [
            { id: `task-project-${Date.now()}`, adsetId: "", name: `新建 ${values.channel || "Meta"} Campaign 配置`, type: "项目配置", owner: "小陈", status: "草稿", updatedAt: formatDate(new Date().toISOString()), summary: "已创建 Campaign 层级配置，等待继续补充计划与素材。" }
          ]
        };
        projects.unshift(project);
      }

      project.name = values.name;
      project.channel = values.channel || project.channel || "Meta";
      project.product = values.product || project.product;
      project.countries = splitProjectCountries(values.countries);
      project.status = mapCampaignStatus(values.campaignStatus);
      project.campaignConfig = {
        campaignName: values.campaignName,
        objective: values.objective,
        buyingType: values.buyingType,
        specialAdCategories: values.specialAdCategories,
        abTest: values.abTest,
        campaignBudget: values.campaignBudget,
        campaignStatus: values.campaignStatus,
        budgetType: values.budgetType,
        budget: values.budget,
        bidStrategy: values.bidStrategy,
        spendLimit: values.spendLimit,
        start: values.start,
        end: values.end,
        account: values.account,
        campaignId: getProjectCampaign(project).campaignId || "待创建"
      };
      project.metaCampaign = project.channel === "Meta" ? project.campaignConfig : project.metaCampaign;

      document.getElementById("projectModal").classList.remove("active");
      state.projectSubview = "list";
      state.activeProjectId = null;
      renderProjectsPage();
      showToast("项目配置已保存");
    }

    function splitProjectCountries(value) {
      const countries = String(value || "").split(/[\/、,，]/).map(item => item.trim()).filter(Boolean);
      return countries.length ? countries : ["未配置国家"];
    }

    function mapCampaignStatus(status) {
      return ["Active", "Enabled"].includes(status) ? "运行中" : status === "Paused" ? "已暂停" : "草稿";
    }

    function renderSimplePages() {
      document.getElementById("dashboardPage").innerHTML = simplePage("数据概览", "实时查看跨平台投放表现、预算消耗和增长趋势", [
        ["总消耗", "$128,420", 72], ["ROAS", "2.84", 84], ["新增注册", "48,920", 64], ["活跃计划", "25", 58]
      ]);
      document.getElementById("campaignsPage").innerHTML = simpleTablePage("广告投放", "统一查看 Meta、Google、TikTok 计划与创建状态", ["计划名称","渠道","状态","预算","成本目标"], [
        ["CB_US_Meta_Reg_01","Meta","待发布","800 USD/日","CPA 7"], ["CB_SEA_TikTok_AEO","TikTok","运行中","500 USD/日","CPA 5.8"], ["CB_Global_Google_UAC","Google","学习期","1200 USD/日","ROAS 180%"]
      ]);
      document.getElementById("materialsPage").innerHTML = simpleTablePage("创意素材", "管理素材库、AI 生成素材、本地上传和跨平台复用", ["素材名称","类型","平台","评分","状态"], [
        ["Candy Level Win","Image 1:1","Meta","91","待审核"], ["3s Puzzle Hook","Video 9:16","TikTok","88","可投放"], ["YouTube Playable","Video 16:9","Google","84","可投放"]
      ]);
      document.getElementById("reportsPage").innerHTML = simpleTablePage("数据报表", "沉淀跨渠道数据报表、归因指标和素材表现", ["报表","范围","更新时间","状态","操作"], [
        ["Candy Blast日报","全渠道","2026-05-28 10:00","已生成","查看"], ["素材CTR排行","Meta / TikTok","2026-05-28 09:30","已生成","查看"], ["预算预警","全部项目","2026-05-28 08:00","监控中","查看"]
      ]);
      document.getElementById("accountPage").innerHTML = simpleTablePage("系统账号设置", "管理团队成员、登录身份和基础账号信息", ["成员","角色","权限组","状态","最近登录"], [
        ["小陈","投放经理","Campaign Operator","启用","2026-05-28 10:12"], ["Lina","管理员","Admin","启用","2026-05-27 18:22"], ["Alex","素材运营","Creative Editor","启用","2026-05-27 15:40"]
      ], true);
      document.getElementById("systemPage").innerHTML = simplePage("系统设置", "配置默认偏好、通知、权限和系统级策略", [
        ["默认币种", "USD", 100], ["预算提醒", "85%", 85], ["审批策略", "开启", 100], ["异常通知", "实时", 100]
      ], true);
      document.getElementById("aiPage").innerHTML = simplePage("AI 使用量", "查看模型调用、Token 消耗、场景日志和预算限制", [
        ["今日调用", "1,284", 54], ["Token 消耗", "3.8M", 76], ["素材生成", "142", 62], ["预算使用", "68%", 68]
      ], true);
    }

    function simplePage(title, desc, metrics, withBack = false) {
      return `
        <div class="page-head">
          <div class="page-title-row">
            ${withBack ? `<button class="back-button" type="button" data-page-target="settings"><span class="material-symbols-outlined">arrow_back</span></button>` : ""}
            <div><h1>${title}</h1><p>${desc}</p></div>
          </div>
        </div>
        <div class="content"><div class="grid-4">${metrics.map(([label, value, pct]) => `<div class="metric-card"><span>${label}</span><b>${value}</b><div class="bar"><i style="width:${pct}%;"></i></div></div>`).join("")}</div></div>
      `;
    }

    function simpleTablePage(title, desc, heads, rows, withBack = false) {
      return `
        <div class="page-head">
          <div class="page-title-row">
            ${withBack ? `<button class="back-button" type="button" data-page-target="settings"><span class="material-symbols-outlined">arrow_back</span></button>` : ""}
            <div><h1>${title}</h1><p>${desc}</p></div>
          </div>
          <button class="btn primary" type="button">${title === "广告投放" ? "新建计划" : "新增"}</button>
        </div>
        <div class="content"><section class="table-card"><table><thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></section></div>
      `;
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("button, input, select");
      if (!target) return;

      const page = target.dataset.pageTarget;
      if (page) { setPage(page); return; }

      const platform = target.dataset.platform;
      if (platform) { state.activePlatform = platform; renderPlatformPage(); return; }

      if (target.dataset.openConfig) { openConfig(target.dataset.openConfig, target.dataset.editId); return; }

      if (target.dataset.openProjectForm !== undefined) { openProjectForm(target.dataset.projectId); return; }

      if (target.dataset.copySelectedProjects !== undefined) { copySelectedProjects(); return; }

      if (target.dataset.deleteSelectedProjects !== undefined) { promptDeleteSelectedProjects(); return; }

      if (target.dataset.copySelectedPlans) { copySelectedPlans(target.dataset.copySelectedPlans); return; }

      if (target.dataset.deleteSelectedPlans) { promptDeleteSelectedPlans(target.dataset.deleteSelectedPlans); return; }

      if (target.dataset.openTaskWindow) { openProjectTaskCreate(target.dataset.openTaskWindow); return; }

      if (target.dataset.viewProjectTasks) { openProjectTaskList(target.dataset.viewProjectTasks); return; }

      if (target.dataset.backProjects !== undefined) { backToProjectList(); return; }

      if (target.dataset.backProjectTasks) { openProjectTaskList(target.dataset.backProjectTasks); return; }

      if (target.dataset.viewTaskDetail) {
        const [projectId, taskId] = target.dataset.viewTaskDetail.split(":");
        openProjectTaskDetail(projectId, taskId);
        return;
      }

      if (target.dataset.editMetaTask) {
        const [projectId, taskId] = target.dataset.editMetaTask.split(":");
        openProjectTaskEdit(projectId, taskId);
        return;
      }

      if (target.dataset.saveMetaTask) { saveMetaTaskConfig(target.dataset.saveMetaTask); return; }

      if (target.dataset.updateMetaTask) {
        const [projectId, taskId] = target.dataset.updateMetaTask.split(":");
        updateMetaTaskConfig(projectId, taskId);
        return;
      }

      if (target.dataset.materialOption) {
        updateMaterialSelection(target.dataset.materialOption, target.dataset.materialFormat);
        return;
      }

      if (target.dataset.closeModal) {
        if (target.dataset.closeModal === "confirmModal") {
          state.pendingDelete = null;
          state.deleteId = null;
        }
        document.getElementById(target.dataset.closeModal).classList.remove("active");
        return;
      }

      if (target.dataset.copyUri) { navigator.clipboard?.writeText(target.dataset.copyUri); showToast("Redirect URI 已复制"); return; }

      if (target.dataset.authorize) {
        const conn = state.connections.find(c => c.id === target.dataset.authorize);
        if (conn) { conn.status = "active"; conn.updated_at = new Date().toISOString(); renderPlatformPage(); showToast("授权成功"); }
        return;
      }

      if (target.dataset.delete) {
        const conn = state.connections.find(c => c.id === target.dataset.delete);
        state.deleteId = target.dataset.delete;
        openConfirmDelete(
          "确认删除连接",
          `将删除 ${conn?.account_name || "该连接"}，已创建计划不会被删除。`,
          { type: "connection", id: target.dataset.delete }
        );
        return;
      }

      if (target.dataset.toggleSub) { state.expanded[target.dataset.toggleSub] = !state.expanded[target.dataset.toggleSub]; renderPlatformPage(); return; }

      if (target.dataset.addSub) {
        state.currentGoogleParent = target.dataset.addSub;
        document.getElementById("subNameInput").value = "";
        document.getElementById("subCustomerInput").value = "";
        document.getElementById("subAccountModal").classList.add("active");
        return;
      }

      if (target.dataset.deleteSub) {
        const [cid, sid] = target.dataset.deleteSub.split(":");
        const conn = state.connections.find(c => c.id === cid);
        if (conn) conn.subAccounts = conn.subAccounts.filter(s => s.id !== sid);
        renderPlatformPage();
        showToast("子账号已删除");
        return;
      }

      if (target.dataset.projectEditField) {
        state.projectEditingField = target.dataset.projectEditField;
        refreshProjectCreationReply();
        return;
      }

      if (target.dataset.projectEditOption) {
        state.projectEditingField = target.dataset.projectEditOption;
        applyProjectFieldEdit(target.dataset.projectEditOption, target.dataset.projectEditValue || "");
        return;
      }

      if (target.dataset.saveProjectEdit) {
        state.projectEditingField = target.dataset.saveProjectEdit;
        saveProjectEditInput(target.dataset.saveProjectEdit);
        return;
      }

      if (target.dataset.taskPromptSubmit) {
        const input = document.getElementById("taskPromptInput");
        if (input) input.value = target.dataset.taskPromptSubmit;
        sendTaskPrompt();
        return;
      }

      if (target.dataset.taskPrompt) {
        const input = document.getElementById("taskPromptInput");
        if (input) {
          input.value = target.dataset.taskPrompt;
          input.focus();
        }
        return;
      }

      if (target.dataset.sendTask !== undefined) { sendTaskPrompt(); return; }

    });

    document.addEventListener("change", event => {
      if (event.target.matches("[data-project-channel]")) {
        state.projectFormChannel = event.target.value;
        const project = state.editingProjectId ? projects.find(item => item.id === state.editingProjectId) : null;
        document.getElementById("projectModalTitle").textContent = project ? `编辑 ${state.projectFormChannel} 项目` : "新建投放项目";
        document.getElementById("projectModalBody").innerHTML = renderProjectForm(project, getProjectCampaign(project));
        hydrateIcons();
        return;
      }
      if (event.target.matches("[data-scope-check]")) updateScopeCounter();
      if (event.target.matches("[data-task-field]")) collectTaskFields();
      if (event.target.id === "planCountInput") {
        state.planCount = Math.max(0, Math.min(99, Number(event.target.value || 0)));
        renderTaskPage();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.target.matches("[data-project-edit-input]") && event.key === "Enter") {
        event.preventDefault();
        state.projectEditingField = event.target.dataset.projectEditInput;
        saveProjectEditInput(event.target.dataset.projectEditInput);
        return;
      }
      if (event.target.id !== "taskPromptInput") return;
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendTaskPrompt();
      }
    });

    function collectTaskFields() {
      document.querySelectorAll("[data-task-field]").forEach(el => {
        state.taskValues[el.dataset.taskField] = el.value;
      });
    }

    document.getElementById("saveConfigBtn").addEventListener("click", saveConfig);
    document.getElementById("saveProjectBtn").addEventListener("click", saveProjectConfig);
    document.getElementById("oauthBtn").addEventListener("click", () => showToast("已打开授权准备流程"));
    document.getElementById("confirmDeleteBtn").addEventListener("click", confirmPendingDelete);
    document.getElementById("saveSubAccountBtn").addEventListener("click", () => {
      const parent = state.connections.find(c => c.id === state.currentGoogleParent);
      const name = document.getElementById("subNameInput").value.trim();
      const customer = document.getElementById("subCustomerInput").value.trim();
      if (!name || !customer) { showToast("请填写完整的子账号信息"); return; }
      parent.subAccounts.push({ id: `g-sub-${Date.now()}`, name, customer_id: customer, status: "active", updated_at: new Date().toISOString() });
      document.getElementById("subAccountModal").classList.remove("active");
      state.expanded[parent.id] = true;
      renderPlatformPage();
      showToast("子账号添加成功");
    });

    function boot() {
      renderNav();
      renderSettingsPage();
      renderPlatformPage();
      renderTaskPage();
      renderProjectsPage();
      renderSimplePages();
      setPage("task");
    }
    boot();
  </script>
</body>
</html>
