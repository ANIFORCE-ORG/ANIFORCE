<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIFORCE - 平台连接与新任务计划创建</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82e8;
      --primary-600: #2563d8;
      --primary-soft: #eaf2ff;
      --text: #111827;
      --muted: #63708a;
      --subtle: #8a96aa;
      --line: #dbe3ef;
      --line-2: #edf1f7;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ok: #16a34a;
      --warn: #b7791f;
      --danger: #dc2626;
      --shadow: 0 20px 58px rgba(15, 23, 42, .08);
      --sidebar: 320px;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #fff;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: normal;
      font-style: normal;
      font-size: 22px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
      font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }
    .app { min-height: 100vh; display: flex; flex-direction: column; background: #fff; }
    .topbar {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-mark, .avatar {
      display: grid;
      place-items: center;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 10px 24px rgba(59, 130, 232, .2);
    }
    .brand strong { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .top-actions { display: flex; align-items: center; gap: 20px; }
    .user { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 46px;
      height: 46px;
      border: 3px solid #b9d3fb;
      color: var(--primary-600);
      background: #eff6ff;
      font-weight: 800;
    }
    .user strong, .user span { display: block; white-space: nowrap; }
    .user strong { font-size: 16px; line-height: 1.2; }
    .user span { margin-top: 3px; color: #5e6b85; font-size: 14px; font-weight: 600; }
    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      color: #4b5567;
      background: transparent;
      border-radius: 999px;
    }
    .icon-button:hover { background: #f1f5fb; color: var(--primary-600); }
    .shell { flex: 1; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: calc(100vh - 88px); }
    .sidebar {
      border-right: 1px solid var(--line);
      background: #fff;
      min-height: calc(100vh - 88px);
      padding: 46px 18px 22px;
      position: sticky;
      top: 88px;
      align-self: start;
    }
    .side-section + .side-section { margin-top: 28px; }
    .side-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px 18px;
      color: #55657d;
      font-size: 15px;
      font-weight: 800;
    }
    .nav-list { display: grid; gap: 8px; }
    .nav-item {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 17px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      background: transparent;
      color: #4c5a73;
      text-align: left;
      font-size: 18px;
      font-weight: 600;
    }
    .nav-item .material-symbols-outlined { font-size: 24px; color: currentColor; }
    .nav-item:hover { background: #f6f9fe; color: var(--primary-600); }
    .nav-item.active {
      color: #2f7be6;
      background: #eaf2ff;
      font-weight: 800;
    }
    .history-item {
      width: 100%;
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      color: #4f5e76;
      background: transparent;
      text-align: left;
      font-size: 16px;
      font-weight: 700;
    }
    .history-item span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .history-item.active { color: #2f7be6; background: #eaf2ff; }
    .main { min-width: 0; background: #fff; }
    .page { display: none; min-height: calc(100vh - 88px); }
    .page.active { display: block; }
    .page-head {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 32px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .page-head.compact { min-height: 92px; }
    .page-title-row { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .back-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #334155;
      background: transparent;
    }
    .back-button:hover { background: #f1f5f9; }
    h1, h2, h3, p { margin-top: 0; }
    .page-head h1 { margin-bottom: 7px; font-size: 28px; line-height: 1.15; letter-spacing: -.03em; }
    .page-head p { margin-bottom: 0; color: #687791; font-size: 17px; font-weight: 600; }
    .content { padding: 32px; }
    .settings-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .settings-card, .panel, .metric-card, .table-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .settings-card {
      min-height: 240px;
      padding: 34px 26px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
    }
    .settings-card .card-title { display: flex; align-items: center; gap: 16px; }
    .settings-card .material-symbols-outlined { color: #347ee9; font-size: 31px; }
    .settings-card h2 { margin: 0; font-size: 22px; line-height: 1.25; }
    .settings-card p { margin: 0; min-height: 44px; color: #65738d; font-size: 17px; font-weight: 600; line-height: 1.55; }
    .settings-card button { margin-top: auto; }
    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 20px;
      background: #fff;
      color: #344054;
      font-size: 16px;
      font-weight: 800;
      transition: .16s ease;
    }
    .btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-600); border-color: var(--primary-600); }
    .btn.soft { border-color: #cfe0fb; background: #eef6ff; color: var(--primary-600); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.danger { border-color: #fecaca; background: #fff5f5; color: #b42318; }
    .btn.danger:hover { border-color: #fda4af; background: #fff1f2; color: #991b1b; }
    .btn:disabled { cursor: not-allowed; opacity: .52; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .panel { padding: 24px; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .panel-title h2, .panel-title h3 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .panel-title p { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .platform-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 32px; }
    .platform-tab {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      text-align: left;
      padding: 25px 22px;
      min-height: 106px;
      transition: .16s ease;
    }
    .platform-tab.active { border-color: var(--primary-600); box-shadow: inset 0 0 0 1px rgba(37, 99, 216, .1); }
    .platform-tab:hover { border-color: #9ec2f5; }
    .platform-tab-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .platform-tab strong { font-size: 22px; line-height: 1.2; }
    .platform-tab p { margin: 14px 0 0; color: #556177; font-size: 16px; line-height: 1.45; font-weight: 600; }
    .status-pill, .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
    }
    .status-pill.connected { color: #047857; background: #ecfdf3; }
    .status-pill.pending { color: #9a5b13; background: #fff7e8; }
    .status-pill.expired { color: #b91c1c; background: #fef2f2; }
    .connection-panel { padding: 28px; }
    .platform-detail-head { display: flex; align-items: center; gap: 13px; margin-bottom: 22px; }
    .platform-detail-head .material-symbols-outlined { color: #1f63bf; font-size: 32px; }
    .platform-detail-head strong { font-size: 20px; }
    .platform-detail-desc { color: #64738c; font-size: 17px; font-weight: 650; margin-bottom: 24px; }
    .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 30px; }
    .step-pill {
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: #273449;
      background: #f8fafc;
      font-size: 16px;
      font-weight: 650;
    }
    .warning {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid #fed7aa;
      background: #fff8ed;
      color: #8a4b0f;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .warning strong { display: block; margin-bottom: 4px; color: #7c3f07; }
    .warning p { margin: 0; color: #9a5b13; line-height: 1.6; }
    .connection-actions { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 20px; }
    .connection-actions p { margin: 0; color: #64738c; font-size: 16px; font-weight: 650; }
    .table-card { overflow: hidden; margin-top: 32px; }
    .table-head {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
    }
    .table-head h2 { margin: 0; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
    th { color: #5f6c81; background: #f8fafc; font-size: 13px; font-weight: 900; }
    td { color: #253044; font-size: 14px; }
    tr:hover td { background: #fbfdff; }
    .row-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .mini {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
    }
    .mini:hover { border-color: #a9c7f2; color: var(--primary-600); background: #f8fbff; }
    .scope-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { color: #1f4e8f; background: #edf5ff; border: 1px solid #d9e8ff; }
    .sub-row td { background: #f8fbff; }
    .sub-account-list { display: grid; gap: 10px; }
    .sub-account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 1px solid #d9e8ff;
      border-radius: 8px;
      padding: 12px 14px;
      background: #fff;
    }
    .empty-state { padding: 44px 20px; text-align: center; color: #6b778f; }
    .empty-state .material-symbols-outlined { display: block; margin: 0 auto 8px; font-size: 54px; color: #94a3b8; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .field { display: grid; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #475569; font-size: 13px; font-weight: 900; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 14px;
      color: #263348;
      background: #fff;
      outline: none;
    }
    .field textarea { min-height: 106px; padding: 12px 14px; resize: vertical; line-height: 1.6; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #7fb1f5; box-shadow: 0 0 0 3px rgba(59, 130, 232, .12); }
    .readonly {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 12px 0 14px;
      background: #f8fafc;
      color: #52617a;
      font-weight: 650;
    }
    .scope-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .scope-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 15px 16px;
      background: #fff;
    }
    .scope-option input { width: 19px; height: 19px; accent-color: var(--primary); margin-top: 1px; }
    .scope-option strong { display: block; }
    .scope-option span { display: block; color: #64738c; margin-top: 5px; font-size: 12px; line-height: 1.45; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: rgba(0, 0, 0, .48);
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      width: min(1176px, calc(100vw - 72px));
      max-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 34px 100px rgba(15, 23, 42, .35);
    }
    .modal.small { width: min(520px, calc(100vw - 40px)); }
    .drawer-backdrop {
      align-items: stretch;
      justify-content: flex-end;
      padding: 0;
      background: rgba(15, 23, 42, .34);
    }
    .modal.drawer {
      width: min(760px, calc(100vw - 28px));
      max-height: none;
      height: 100vh;
      border-radius: 8px 0 0 8px;
    }
    .modal-head {
      min-height: 104px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 32px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
    .modal-body { padding: 32px; overflow: auto; }
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 32px 32px;
      border-top: 1px solid var(--line);
    }
    .modal-foot .right { display: flex; gap: 12px; }
    .toast-wrap {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 90;
      display: grid;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      min-width: 260px;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 13px 16px;
      background: #f0fdf4;
      color: #166534;
      box-shadow: 0 14px 34px rgba(15, 23, 42, .12);
      font-weight: 800;
    }
    .task-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; }
    .task-hero {
      border-bottom: 1px solid var(--line);
      padding: 28px 32px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }
    .task-hero h1 { margin-bottom: 10px; font-size: 30px; letter-spacing: -.04em; }
    .task-hero p { margin: 0; color: #65738d; font-size: 16px; line-height: 1.7; font-weight: 650; }
    .stepper { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
    .task-step {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      background: #fff;
      color: #52617a;
      font-weight: 850;
    }
    .task-step em {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #64748b;
      background: #eef2f7;
      font-style: normal;
      font-size: 13px;
    }
    .task-step.active { border-color: var(--primary); color: var(--primary-600); background: #f7fbff; }
    .task-step.active em { color: #fff; background: var(--primary); }
    .task-card { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 24px; margin-bottom: 20px; }
    .task-card h2 { margin-bottom: 8px; font-size: 21px; }
    .task-card > p { color: var(--muted); line-height: 1.6; }
    .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 4px; background: #f8fafc; }
    .segmented button {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: transparent;
      color: #64748b;
      font-weight: 850;
    }
    .segmented button.active { color: var(--primary-600); background: #fff; box-shadow: 0 2px 10px rgba(15, 23, 42, .07); }
    .platform-source {
      display: grid;
      gap: 10px;
      border: 1px solid #cfe0fb;
      border-radius: 8px;
      padding: 16px;
      background: #f7fbff;
      margin: 18px 0;
    }
    .platform-source strong { color: #194f96; }
    .platform-source p { margin: 0; color: #5e6b85; line-height: 1.6; }
    .asset-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .asset-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      transition: .15s ease;
    }
    .asset-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 232, .12); }
    .asset-thumb {
      height: 106px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      margin-bottom: 12px;
      color: #1f4e8f;
      background: linear-gradient(135deg, #eaf2ff, #f8fafc);
      font-size: 34px;
      font-weight: 900;
    }
    .asset-card strong { display: block; }
    .asset-card p { margin: 8px 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .side-panel { position: sticky; top: 116px; align-self: start; }
    .summary-list { display: grid; gap: 12px; }
    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line-2);
      color: #64748b;
      font-size: 14px;
    }
    .summary-item b { color: #111827; text-align: right; }
    .result-stack { display: grid; gap: 12px; margin-top: 18px; }
    .created-card {
      border: 1px solid #cfe0fb;
      border-radius: 8px;
      padding: 16px;
      background: #f8fbff;
    }
    .created-card strong { display: block; color: #173b74; }
    .created-card span { display: block; color: #65738d; margin-top: 6px; font-size: 13px; }
    .copy-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .project-note {
      border: 1px solid #cfe0fb;
      background: #f7fbff;
      border-radius: 8px;
      padding: 16px;
      color: #52617a;
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .project-card {
      min-height: 292px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      background: #fff;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .project-card:hover { border-color: #b9d3f5; box-shadow: 0 14px 32px rgba(15, 23, 42, .06); transform: translateY(-1px); }
    .project-card h3 { margin-bottom: 8px; font-size: 17px; line-height: 1.35; letter-spacing: 0; }
    .project-card.clickable { transition: .16s ease; }
    .project-card.clickable:hover { border-color: #b9d3f5; box-shadow: 0 12px 28px rgba(15, 23, 42, .06); }

    .chat-bubble {
      border: 0;
      border-radius: 0;
      padding: 2px 0;
      color: #111827;
      background: transparent;
      font-size: 14px;
      line-height: 1.75;
    }
    .chat-message.from-user .chat-bubble {
      border: 1px solid #dbe3ef;
      border-radius: 18px;
      padding: 12px 16px;
      background: #f7f9fc;
    }
    .chat-bubble p {
      margin-bottom: 10px;
    }
    .chat-bubble ul {
      margin: 10px 0 0;
      padding-left: 19px;
    }
    .chat-bubble li + li {
      margin-top: 5px;
    }
    .task-welcome {
      max-width: 760px;
      margin: auto 0;
      padding: 16px 0 8px 48px;
    }
    .task-welcome h2 {
      margin-bottom: 10px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .task-welcome p {
      max-width: 620px;
      color: #63708a;
      line-height: 1.8;
      font-weight: 600;
    }
    .quick-prompts {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 4px 20px 48px;
    }
    .prompt-chip {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      color: #344054;
      background: #fff;
      font-size: 13px;
      font-weight: 750;
    }
    .prompt-chip:hover {
      border-color: #bad5fb;
      color: var(--primary-600);
      background: #f7fbff;
    }
    .prompt-composer {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
      border: 1px solid #d6deeb;
      border-radius: 26px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(15, 23, 42, .09);
    }
    .composer-tool,
    .composer-send {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      color: #475569;
      background: transparent;
    }
    .composer-tool:hover {
      background: #f1f5f9;
      color: var(--primary-600);
    }
    .composer-send {
      color: #fff;
      background: #111827;
    }
    .composer-send:hover {
      background: var(--primary-600);
    }
    .composer-textarea {
      width: 100%;
      min-height: 42px;
      max-height: 160px;
      border: 0;
      outline: 0;
      resize: none;
      padding: 10px 2px 7px;
      color: #111827;
      background: transparent;
      line-height: 1.6;
      font-size: 14px;
    }
    .composer-textarea::placeholder {
      color: #8a96aa;
    }
    .assistant-plan {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .assistant-plan-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
      max-width: 560px;
    }
    .assistant-plan-row span {
      color: #64748b;
      font-weight: 750;
    }
    .assistant-plan-row b {
      color: #111827;
      font-weight: 750;
    }
    .validation-summary {
      display: grid;
      gap: 10px;
      max-width: 100%;
      margin-top: 12px;
    }
    .validation-summary.cols-2,
    .validation-summary.cols-3 {
      gap: 14px;
    }
    .validation-summary.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .validation-summary.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .validation-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #fff;
    }
    .validation-card.warn {
      border-color: #f4d7a1;
      background: #fffaf0;
    }
    .validation-card.ok {
      border-color: #c8ead5;
      background: #f6fef9;
    }
    .validation-card h3 {
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
    }
    .validation-status {
      border-radius: 999px;
      padding: 4px 9px;
      color: #166534;
      background: #dcfce7;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }
    .validation-card.warn .validation-status {
      color: #92400e;
      background: #fef3c7;
    }
    .field-checks {
      display: grid;
      gap: 8px;
    }
    .field-check {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border-top: 1px solid var(--line-2);
      padding-top: 8px;
      color: #475569;
      font-size: 12px;
      line-height: 1.55;
    }
    .field-check:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .field-check strong {
      color: #334155;
    }
    .field-check b {
      color: #111827;
      font-weight: 760;
      word-break: break-word;
    }
    .field-check em {
      justify-self: start;
      border-radius: 999px;
      padding: 2px 8px;
      color: #166534;
      background: #dcfce7;
      font-style: normal;
      font-weight: 850;
    }
    .field-check.missing em,
    .field-check.invalid em {
      color: #991b1b;
      background: #fee2e2;
    }
    .field-check.missing b,
    .field-check.invalid b {
      color: #991b1b;
    }
    .field-check.project-edit-row,
    .project-flow-step.project-edit-row {
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: .16s ease;
    }
    .field-check.project-edit-row {
      border-right: 0;
      border-bottom: 0;
      border-left: 0;
      background: transparent;
    }
    .field-check.project-edit-row:hover,
    .field-check.project-edit-row.active {
      border-color: #b9d3fb;
      color: #194f96;
      background: #f7fbff;
    }
    .project-flow-step.project-edit-row {
      font-family: inherit;
    }
    .project-flow-step.project-edit-row:hover,
    .project-flow-step.project-edit-row.active {
      border-color: #7fb0f5;
      box-shadow: inset 0 0 0 1px rgba(59, 130, 232, .08);
    }
    .project-edit-panel {
      border: 1px solid #cfe0fb;
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
      background: #f7fbff;
    }
    .project-edit-panel h4 {
      margin: 0 0 10px;
      color: #194f96;
      font-size: 14px;
    }
    .project-edit-panel p {
      margin: 0 0 10px;
      color: #64748b;
      font-weight: 650;
      line-height: 1.6;
    }
    .project-edit-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
    .project-edit-input-row input {
      min-height: 38px;
      border: 1px solid #d6deeb;
      border-radius: 8px;
      padding: 0 12px;
      background: #fff;
      color: #111827;
      outline: 0;
    }
    .project-edit-input-row input:focus {
      border-color: #9ec2f5;
      box-shadow: 0 0 0 3px rgba(59, 130, 232, .12);
    }
    .assistant-alert {
      max-width: 820px;
      border: 1px solid #f4d7a1;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 12px 0;
      color: #7c4a03;
      background: #fffaf0;
      font-weight: 700;
      line-height: 1.7;
    }
    .project-flow-card {
      max-width: 840px;
      border: 1px solid #d8e5f7;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
      background: #fbfdff;
    }
    .project-flow-card h3 {
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      line-height: 1.35;
    }
    .project-flow-status {
      border-radius: 999px;
      padding: 4px 9px;
      color: #194f96;
      background: #eaf2ff;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }
    .project-flow-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .project-flow-step {
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 9px 10px;
      color: #64748b;
      background: #fff;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.45;
    }
    .project-flow-step.done {
      border-color: #c8ead5;
      color: #166534;
      background: #f6fef9;
    }
    .project-flow-step.active {
      border-color: #b9d3fb;
      color: #194f96;
      background: #f7fbff;
    }
    .account-choice-list {
      display: grid;
      gap: 8px;
      margin: 10px 0 0;
    }
    .account-choice {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }
    .account-choice strong,
    .project-preview-grid strong {
      display: block;
      color: #111827;
      font-weight: 800;
    }
    .account-choice span,
    .project-preview-grid span {
      display: block;
      margin-top: 3px;
      color: #64748b;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.45;
    }
    .project-preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .project-preview-grid > div {
      border-top: 1px solid var(--line-2);
      padding-top: 9px;
    }
    .assistant-action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    /* Align page typography with the compact navigation scale */
    :root {
      --type-nav: 11.5px;
      --type-small: 10.5px;
      --type-body: 11.5px;
      --type-mid: 12px;
      --type-section: 13.5px;
      --type-title: 15px;
      --type-page-title: 17px;
    }
    body,
    .chat-bubble,
    .project-card-title p,
    .project-task-item p,
    .task-panel > p,
    .warning p {
      font-size: var(--type-body);
    }
    .nav-item,
    .history-item,
    .btn,
    .field input,
    .field select,
    .field textarea,
    .readonly,
    td,
    .composer-input,
    .composer-textarea,
    .prompt-chip,
    .chat-step,
    .task-status,
    .account-pill,
    .field-check {
      font-size: var(--type-nav);
    }
    .user span,
    .page-head p,
    .task-hero p,
    .task-chat-title p,
    .subpage-title p,
    .project-note,
    .panel-title p,
    .platform-tab p,
    .platform-detail-desc,
    .connection-actions p,
    .asset-card p,
    .created-card span,
    .metric-card span,
    .composer-hint,
    .adset-row p,
    .task-welcome p {
      font-size: var(--type-mid);
    }
    .chip,
    .status-pill,
    th,
    .mini,
    .summary-item,
    .field label,
    .meta-field,
    .creative-row,
    .scope-option span,
    .project-detail-head,
    .material-picker-head,
    .material-option span,
    .material-option em,
    .validation-status,
    .chat-step em {
      font-size: var(--type-small);
    }
    .material-option strong,
    .adset-row h4,
    .project-task-item h3,
    .context-card h3,
    .validation-card h3 {
      font-size: var(--type-section);
    }
    .project-card h3,
    .task-panel h2,
    .task-panel h3,
    .meta-form-card h2,
    .panel-title h2,
    .panel-title h3,
    .platform-detail-head strong,
    .table-head h2,
    .chat-bubble .panel-title h2 {
      font-size: var(--type-title);
    }
    .page-head h1,
    .task-chat-title h1,
    .subpage-title h1,
    .settings-card h2,
    .platform-tab strong,
    .task-hero h1,
    .task-card h2,
    .modal-head h2,
    .task-welcome h2 {
      font-size: var(--type-page-title);
    }
    .metric-card b { font-size: 18px; }

    @media (max-width: 1280px) {
      .task-chat-body { grid-template-columns: 1fr; }
      .context-panel { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .topbar { height: 68px; padding: 0 14px; }
      .brand strong { font-size: 18px; }
      .top-actions { gap: 8px; }
      .avatar { width: 34px; height: 34px; }
      .shell, .page, .task-chat-shell { min-height: calc(100vh - 68px); }
      .sidebar { padding: 12px; }
      .sidebar .side-section:last-child { display: none; }
      .nav-item { min-height: 40px; font-size: 13px; }
      .task-chat-head { padding: 16px 18px 12px; }
      .task-chat-title { flex-direction: column; gap: 12px; }
      .chat-stepper, .task-chat-body, .context-panel { grid-template-columns: 1fr; }
      .task-chat-body { padding: 14px 18px 22px; }
      .chat-panel { height: 100%; min-height: 0; max-height: none; }
      .chat-stream { padding: 16px; }
      .chat-message, .chat-message.from-user { grid-template-columns: 28px minmax(0, 1fr); justify-content: stretch; }
      .chat-message.from-user .chat-avatar { order: -1; }
      .chat-avatar { width: 28px; height: 28px; }
      .chat-bubble .panel-title { flex-direction: column; align-items: stretch; }
      .segmented { width: 100%; }
      .segmented button { flex: 1; }
      .composer-actions { align-items: stretch; flex-direction: column; }
      .composer-actions .right { justify-content: stretch; }
      .composer-actions .right .btn { flex: 1; }
      .task-welcome { padding-left: 0; }
      .task-welcome h2 { font-size: 23px; }
      .quick-prompts { padding-left: 0; }
      .validation-summary.cols-2,
      .validation-summary.cols-3 { grid-template-columns: 1fr; }
      .project-flow-steps,
      .project-preview-grid { grid-template-columns: 1fr; }
      .account-choice { grid-template-columns: 1fr; }
      .project-edit-input-row { grid-template-columns: 1fr; }
      .field-check { grid-template-columns: 1fr; gap: 4px; }
      .field-check em { justify-self: start; }
      .subpage-head, .project-task-head { flex-direction: column; align-items: stretch; }
      .subpage-actions { justify-content: stretch; }
      .subpage-actions .btn { flex: 1; }
      .task-detail-layout { grid-template-columns: 1fr; }
      .campaign-summary { position: static; }
    }
    @media (max-width: 1280px) {
      :root { --sidebar: 286px; }
      .settings-grid, .asset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .task-layout { grid-template-columns: 1fr; }
      .side-panel { position: static; }
    }
    @media (max-width: 900px) {
      .topbar { padding: 0 20px; }
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: static; min-height: auto; padding: 18px; border-right: 0; border-bottom: 1px solid var(--line); }
      .nav-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-item { border-radius: 8px; }
      .settings-grid, .grid-2, .grid-3, .grid-4, .platform-tabs, .steps, .form-grid, .scope-grid, .asset-grid, .stepper, .meta-field-grid, .material-options {
        grid-template-columns: 1fr;
      }
      .project-card-actions { grid-template-columns: 1fr; }
      .project-card-head, .adset-row-head, .creative-row { grid-template-columns: 1fr; flex-direction: column; align-items: stretch; }
      .creative-row { display: grid; }
      .subpage-content { padding: 20px; }
      .content, .task-hero { padding: 20px; }
      .page-head { padding: 20px; }
      .user span { display: none; }
      .nav-item,
      .history-item,
      .btn,
      .field input,
      .field select,
      .field textarea,
      .readonly,
      td,
      .composer-input,
      .composer-textarea,
      .prompt-chip,
      .chat-step,
      .task-status,
      .account-pill,
      .field-check {
        font-size: var(--type-nav);
      }
      .page-head h1,
      .task-chat-title h1,
      .subpage-title h1,
      .task-welcome h2 {
        font-size: var(--type-page-title);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span class="material-symbols-outlined">rocket_launch</span></div>
        <strong>ANIFORCE</strong>
      </div>
      <div class="top-actions">
        <div class="user">
          <div class="avatar">小</div>
          <div>
            <strong>小陈</strong>
            <span>投放经理 · FunGame Studio</span>
          </div>
        </div>
        <button class="icon-button" type="button" aria-label="通知"><span class="material-symbols-outlined">notifications</span></button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <div class="side-section">
          <div class="side-label">
            <span>功能导航</span>
            <button class="icon-button" type="button" aria-label="折叠菜单"><span class="material-symbols-outlined">menu_open</span></button>
          </div>
          <div class="nav-list" id="mainNav"></div>
        </div>
        <div class="side-section">
          <div class="side-label"><span>历史会话</span></div>
          <div class="nav-list">
            <button class="history-item active" type="button"><span class="material-symbols-outlined">chat</span><span>Candy Blast投放...</span></button>
            <button class="history-item" type="button"><span class="material-symbols-outlined">chat</span><span>素材优化建议</span></button>
            <button class="history-item" type="button"><span class="material-symbols-outlined">chat</span><span>东南亚市场测试</span></button>
          </div>
        </div>
      </aside>

      <main class="main">
        <section class="page" data-page="task" id="taskPage"></section>
        <section class="page" data-page="dashboard" id="dashboardPage"></section>
        <section class="page" data-page="projects" id="projectsPage"></section>
        <section class="page" data-page="campaigns" id="campaignsPage"></section>
        <section class="page" data-page="materials" id="materialsPage"></section>
        <section class="page" data-page="reports" id="reportsPage"></section>
        <section class="page" data-page="settings" id="settingsPage"></section>
        <section class="page" data-page="account" id="accountPage"></section>
        <section class="page" data-page="system" id="systemPage"></section>
        <section class="page" data-page="platform" id="platformPage"></section>
        <section class="page" data-page="ai" id="aiPage"></section>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="configModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="configTitle">Meta App 配置</h2>
        <button class="icon-button" type="button" data-close-modal="configModal" aria-label="关闭"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body" id="configBody"></div>
      <div class="modal-foot">
        <span id="scopeCounter" style="color:#64748b;font-weight:700;">已选择 3 个权限</span>
        <div class="right">
          <button class="btn primary" type="button" id="saveConfigBtn">保存配置</button>
          <button class="btn" type="button" id="oauthBtn">前往开发者平台</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="subAccountModal">
    <div class="modal small">
      <div class="modal-head">
        <h2>添加 Google 子账号</h2>
        <button class="icon-button" type="button" data-close-modal="subAccountModal" aria-label="关闭"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body">
        <div class="form-grid" style="grid-template-columns:1fr;">
          <div class="field"><label>子账号名称</label><input id="subNameInput" placeholder="例如 RPG_US_iOS" /></div>
          <div class="field"><label>Customer ID</label><input id="subCustomerInput" placeholder="例如 123-456-7890" /></div>
        </div>
      </div>
      <div class="modal-foot" style="justify-content:flex-end;">
        <div class="right">
          <button class="btn" type="button" data-close-modal="subAccountModal">取消</button>
          <button class="btn primary" type="button" id="saveSubAccountBtn">添加</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="confirmModal">
    <div class="modal small">
      <div class="modal-head"><h2 id="confirmModalTitle">确认删除连接</h2></div>
      <div class="modal-body"><p id="confirmText" style="margin:0;color:#52617a;line-height:1.7;"></p></div>
      <div class="modal-foot" style="justify-content:flex-end;">
        <div class="right">
          <button class="btn" type="button" data-close-modal="confirmModal">取消</button>
          <button class="btn danger" type="button" id="confirmDeleteBtn">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop drawer-backdrop" id="projectModal">
    <div class="modal drawer">
      <div class="modal-head">
        <h2 id="projectModalTitle">Meta 项目配置</h2>
        <button class="icon-button" type="button" data-close-modal="projectModal" aria-label="关闭"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body" id="projectModalBody"></div>
      <div class="modal-foot">
        <span id="projectModalHint" style="color:#64748b;font-weight:700;">项目对应 Meta Campaign 层级</span>
        <div class="right">
          <button class="btn" type="button" data-close-modal="projectModal">取消</button>
          <button class="btn primary" type="button" id="saveProjectBtn">保存项目</button>
        </div>
      </div>
    </div>
  </div>

    function ok(value) {
      return { status: "ok", value };
    }

    function missing(message) {
      return { status: "missing", message };
    }

    function invalid(message) {
      return { status: "invalid", message };
    }

    function matchObjective(text, map) {
      const lower = text.toLowerCase();
      const objective = Object.keys(map).find(key => text.includes(key) || lower.includes(key.toLowerCase()));
      return objective ? ok(map[objective]) : missing("请补充投放目标，例如注册、安装、付费或 ROAS");
    }

    function matchBudget(text) {
      const budget = text.match(/(\d+(?:\.\d+)?)\s*(美元|usd|美金)/i);
      if (!budget) return missing("请补充预算金额，例如日预算 800 美元");
      const value = Number(budget[1]);
      if (!Number.isFinite(value) || value <= 0) return invalid("预算必须大于 0");
      const budgetType = /总预算|lifetime/i.test(text) ? "总预算" : /日预算|daily|每天/i.test(text) ? "日预算" : "预算类型未写明，默认按日预算校验";
      return ok(`${budgetType} ${value} USD`);
    }

    function matchCountry(text) {
      const countries = ["美国", "加拿大", "东南亚", "巴西", "泰国", "印尼", "越南", "日本", "韩国", "全球"];
      const matched = countries.filter(country => text.includes(country));
      return matched.length ? ok(matched.join(" / ")) : missing("请补充投放国家或地区");
    }

    function matchConversion(text, fallback) {
      if (/completeRegistration|注册/i.test(text)) return ok("CompleteRegistration");
      if (/purchase|付费|购买/i.test(text)) return ok("Purchase");
      if (/install|安装/i.test(text)) return ok("Install");
      return missing(`请补充转化事件，支持 ${fallback}`);
    }

    function matchCreative(text, missingMessage) {
      if (/不需要|无需|无素材|不用新素材/i.test(text)) return ok("无需新素材");
      if (/素材|视频|图片|轮播|creative|spark|9:16|标题|描述/i.test(text)) return ok("已匹配素材要求");
      return missing(missingMessage);
    }

      };

          <p>直接描述你想创建新项目还是新任务。我会先识别意图；如果是新项目，会在当前对话里逐步校验渠道、账户授权和 Campaign 字段，再生成项目并展示项目信息。</p>
        </div>
      `;
    }

    function renderQuickPrompts() {
      const prompts = [
        "新建一个 Candy Quest 北美 Meta 项目，日预算 1000 美元，目标注册",
        "我要创建新项目，产品 RPG X，渠道 Google，美国和加拿大",
        "为 Candy Blast 创建美国 Meta 注册计划，日预算 800 美元",
        "复用上周 TikTok 计划，改成东南亚安装目标"
      ];
      return `<div class="quick-prompts">${prompts.map(text => `<button class="prompt-chip" type="button" data-task-prompt="${escapeHtml(text)}">${escapeHtml(text)}</button>`).join("")}</div>`;
    }

    function renderConversationMessage(message) {
      const fromUser = message.role === "user";
      return `
        <article class="chat-message ${fromUser ? "from-user" : "from-assistant"}">
          ${fromUser ? "" : `<div class="chat-avatar">AI</div>`}
          <div class="chat-bubble">${message.html}</div>
          ${fromUser ? `<div class="chat-avatar">我</div>` : ""}
        </article>
      `;
    }

    function sendTaskPrompt() {
      const input = document.getElementById("taskPromptInput");
      const text = input?.value.trim();
      if (!text) return;
      state.taskMessages = state.taskMessages || [];
      state.taskMessages.push({ role: "user", html: `<p>${escapeHtml(text)}</p>` });
      state.taskMessages.push({ role: "assistant", html: handleTaskConversation(text) });
      state.taskCreated = false;
      renderTaskPage();
    }

    function handleTaskConversation(text) {
      if (isProjectInfoRequest(text) && state.lastCreatedProjectId) {
        const project = projects.find(item => item.id === state.lastCreatedProjectId);
        if (project) return renderCreatedProjectReply(project, "这是刚刚在当前对话里创建的新项目。");
      }
      const intent = detectTaskIntent(text);
      if (intent === "task") {
        state.taskFlow = "task";
        state.projectCreation = null;
      }
      if (intent === "project" || (state.taskFlow === "project" && intent !== "task")) {
        state.taskFlow = "project";
        return handleProjectCreationConversation(text);
      }

      const matchedProjects = matchProjectsFromPrompt(text);
      if (matchedProjects.length) {
        mergeSelectedProjects(matchedProjects.map(project => project.id));
      }
      state.taskFlow = "task";
      return buildTaskReply(text);
    }

    function detectTaskIntent(text) {
      const normalized = text.toLowerCase();
      const projectSignals = isStartNewProjectRequest(text) || /campaign\s*项目|campaign/i.test(text);
      const taskSignals = /新任务|创建任务|创建计划|新建计划|ad\s*set|adgroup|ad group|计划|任务|素材测试|复用/i.test(normalized);
      if (taskSignals && !projectSignals) return "task";
      if (projectSignals && !taskSignals) return "project";
      if (projectSignals && /项目/.test(text)) return "project";
      if (taskSignals) return "task";
      return state.taskFlow === "project" ? "project" : "task";
    }

    function handleProjectCreationConversation(text) {
      if (isProjectInfoRequest(text) && state.lastCreatedProjectId) {
        const project = projects.find(item => item.id === state.lastCreatedProjectId);
        if (project) return renderCreatedProjectReply(project, "这是刚刚在当前对话里创建的新项目。");
      }

      const startNewProject = isStartNewProjectRequest(text);
      if (startNewProject) {
        state.projectCreation = createProjectDraft();
        state.projectEditingField = "";
      }
      const draft = state.projectCreation || createProjectDraft();
      state.projectCreation = draft;

      mergeProjectDraftFromText(draft, text);
      if (draft.channel && isAuthorizationMessage(text)) {
        ensureChannelAuthorized(draft.channel, text);
      }
      mergeProjectDraftFromText(draft, text);

      const validation = validateProjectDraft(draft);
      if (isConfirmProjectCreate(text)) {
        if (validation.canCreate) {
          const project = createProjectFromDialogDraft(draft);
          state.projectCreation = null;
          state.projectEditingField = "";
          state.taskFlow = "idle";
          state.lastCreatedProjectId = project.id;
          state.selectedProjects = [project.id];
          return renderCreatedProjectReply(project, "新项目已创建，已同步到项目管理列表。");
        }
        return renderProjectCreationReply(draft, validation, "你已确认创建，但仍有必填校验没有通过。");
      }

      return renderProjectCreationReply(draft, validation);
    }

    function isStartNewProjectRequest(text) {
      if (isConfirmProjectCreate(text)) return false;
      return /新项目|新建项目|创建项目|创建新项目|新增项目|建项目|项目创建/i.test(text)
        || /(新建|创建|新增|建)(?:一个|1个)?[^，。；\n]{0,64}项目/i.test(text);
    }

    function createProjectDraft() {
      return {
        channel: "",
        account: "",
        accountName: "",
        accountType: "",
        connectionId: "",
        name: "",
        product: "",
        countries: [],
        objective: "",
        budget: "",
        campaignName: "",
        buyingType: "",
        bidStrategy: "",
        start: "",
        end: "",
        createdProjectId: ""
      };
    }

    function mergeProjectDraftFromText(draft, text) {
      const channels = detectChannels(text);
      if (channels.length) draft.channel = channels[0];

      const product = extractProjectProduct(text);
      if (product) draft.product = product;

      const projectName = extractProjectName(text, draft.channel);
      if (projectName) draft.name = projectName;

      const countries = extractProjectCountries(text);
      if (countries.length) draft.countries = countries;

      const objective = extractProjectObjective(text, draft.channel);
      if (objective) draft.objective = objective;

      const budget = matchBudget(text);
      if (budget.status === "ok") draft.budget = budget.value;

      const campaignName = extractCampaignName(text);
      if (campaignName) draft.campaignName = campaignName;

      const start = text.match(/(?:开始|start)\s*(?:时间)?\s*[:：]?\s*([^，。；\n]{4,32})/i);
      if (start) draft.start = start[1].trim();
      const end = text.match(/(?:结束|end)\s*(?:时间)?\s*[:：]?\s*([^，。；\n]{4,32})/i);
      if (end) draft.end = end[1].trim();

      if (draft.channel) {
        const accounts = getAvailableProjectAccounts(draft.channel);
        const matchedAccount = matchProjectAccountFromText(text, accounts);
        if (matchedAccount) applyDraftAccount(draft, matchedAccount);
      }
    }

    function extractProjectName(text, channel) {
      const explicit = text.match(/(?:项目名称|项目名|project name|命名为|项目叫|名称是|名称为)\s*[:：]?\s*([^，。；\n]{2,56})/i);
      if (explicit) {
        const name = cleanProjectName(explicit[1], channel);
        return isMeaningfulProjectValue(name) ? name : "";
      }

      const beforeProject = text.match(/(?:新建|创建|新增|建)(?:一个|1个)?\s*([^，。；\n]{2,64}?)\s*(?:投放)?项目/i);
      if (beforeProject && !/^新$/.test(beforeProject[1].trim())) {
        const name = cleanProjectName(beforeProject[1], channel);
        return isMeaningfulProjectValue(name) ? name : "";
      }

      return "";
    }

    function cleanProjectName(value, channel) {
      let name = String(value || "")
        .replace(/^(一个|新的?|投放|项目|名称|叫|为|是)\s*/i, "")
        .replace(/(项目|campaign|投放项目)$/i, "")
        .replace(/(渠道|账户|产品|国家|地区|目标|预算).*$/i, "")
        .trim();
      ["Meta", "Google", "TikTok", "facebook", "instagram", "谷歌", "抖音"].forEach(word => {
        name = name.replace(new RegExp(`\\s*${word}\\s*`, "ig"), " ");
      });
      if (channel) name = name.replace(new RegExp(`\\s*${channel}\\s*`, "ig"), " ");
      return name.replace(/\s{2,}/g, " ").trim();
    }

    function extractProjectProduct(text) {
      const product = text.match(/(?:产品|游戏|应用|App)\s*(?:是|为|叫|:|：)?\s*([^，。；\n]{2,42})/i);
      if (!product) return "";
      const value = product[1].replace(/(渠道|国家|地区|目标|预算).*$/i, "").trim();
      return isMeaningfulProjectValue(value) ? value : "";
    }

    function isMeaningfulProjectValue(value) {
      const normalized = String(value || "").trim();
      if (normalized.length < 2) return false;
      if (/^(一个|1个|新的?|项目|新项目|投放|投放项目|计划|新计划|任务|新任务|campaign)$/i.test(normalized)) return false;
      if (/^(meta|google|tiktok|facebook|instagram|谷歌|抖音|脸书)$/i.test(normalized)) return false;
      return /[\u4e00-\u9fa5A-Za-z0-9]/.test(normalized);
    }

    function extractProjectCountries(text) {
      const countryMap = {
        "北美": ["美国", "加拿大"],
        "美国": ["美国"],
        "加拿大": ["加拿大"],
        "东南亚": ["东南亚"],
        "SEA": ["东南亚"],
        "巴西": ["巴西"],
        "泰国": ["泰国"],
        "印尼": ["印尼"],
        "越南": ["越南"],
        "日本": ["日本"],
        "韩国": ["韩国"],
        "全球": ["全球"]
      };
      const matched = [];
      Object.entries(countryMap).forEach(([keyword, values]) => {
        const pattern = keyword === "SEA" ? /sea/i : new RegExp(keyword, "i");
        if (pattern.test(text)) values.forEach(item => matched.push(item));
      });
      return Array.from(new Set(matched));
    }

    function extractProjectObjective(text, channel) {
      if (/注册|lead|completeRegistration/i.test(text)) return channel === "Google" ? "App Campaign registrations / tCPA" : "CompleteRegistration / Leads";
      if (/安装|install/i.test(text)) return channel === "Google" ? "App Campaign installs / tCPI" : "App promotion / Install";
      if (/付费|购买|purchase|sales/i.test(text)) return "Purchase / Sales";
      if (/roas|价值|value/i.test(text)) return "ROAS / Value optimization";
      if (/流量|traffic/i.test(text)) return "Traffic";
      return "";
    }

    function extractCampaignName(text) {
      const campaign = text.match(/(?:Campaign 名称|Campaign名|campaign name|计划名称|广告系列名称)\s*[:：]?\s*([^，。；\n]{2,56})/i);
      return campaign ? campaign[1].trim() : "";
    }

    function getAvailableProjectAccounts(channel, includeUnauthorized = false) {
      return state.connections
        .filter(conn => conn.platform === channel && (includeUnauthorized || conn.status === "active"))
        .flatMap(conn => {
          const rows = [{
            id: conn.account_id,
            name: conn.account_name,
            type: channel === "Google" ? "MCC" : "广告账户",
            connectionId: conn.id,
            status: conn.status
          }];
          if (channel === "Google") {
            (conn.subAccounts || []).filter(sub => includeUnauthorized || sub.status === "active").forEach(sub => {
              rows.push({
                id: sub.customer_id,
                name: sub.name,
                type: "Customer",
                connectionId: conn.id,
                status: sub.status
              });
            });
          }
          return rows;
        });
    }

    function matchProjectAccountFromText(text, accounts) {
      if (!accounts.length) return null;
      const lower = text.toLowerCase();
      const direct = accounts.find(account => {
        return lower.includes(String(account.id).toLowerCase()) || lower.includes(String(account.name).toLowerCase());
      });
      if (direct) return direct;
      if (/默认账户|唯一账户|当前账户|这个账户|确认账户|选择账户|用此账户|使用账户|账户确认/i.test(text) && accounts.length === 1) {
        return accounts[0];
      }
      const ordinal = text.match(/第\s*([一二三四五12345])\s*(?:个)?账户/i);
      if (ordinal) {
        const map = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5 };
        const index = Number(map[ordinal[1]] || ordinal[1]) - 1;
        return accounts[index] || null;
      }
      return null;
    }

    function applyDraftAccount(draft, account) {
      draft.account = account.id;
      draft.accountName = account.name;
      draft.accountType = account.type;
      draft.connectionId = account.connectionId;
    }

    function isAuthorizationMessage(text) {
      return /授权|鉴权|oauth|已授权|完成授权|授权完成|完成鉴权|激活|同步账户/i.test(text);
    }

    function ensureChannelAuthorized(channel, text) {
      if (!isAuthorizationMessage(text)) return null;
      let conn = state.connections.find(item => item.platform === channel);
      if (!conn) {
        const key = channel.toLowerCase();
        conn = {
          id: `${key}-dialog-${Date.now()}`,
          platform: channel,
          account_id: channel === "Google" ? `MCC-${Math.floor(Math.random() * 900)}-${Math.floor(Math.random() * 900)}-${Math.floor(Math.random() * 9000)}` : `${key}_ads_${Math.floor(Math.random() * 900000)}`,
          account_name: `${channel} Dialog Authorized Account`,
          app_id: `${key}-dialog-app`,
          status: "active",
          scopes: (platforms[key]?.scopes || []).map(item => item[0]),
          updated_at: new Date().toISOString(),
          subAccounts: []
        };
        state.connections.unshift(conn);
        return conn;
      }
      conn.status = "active";
      conn.updated_at = new Date().toISOString();
      return conn;
    }

    function isConfirmProjectCreate(text) {
      return /确认创建项目|确认新建项目|创建项目吧|可以创建|确认创建|提交项目|生成项目/i.test(text);
    }

    function isProjectInfoRequest(text) {
      return /查看.*项目|项目.*信息|刚刚.*项目|新项目详情|项目详情/i.test(text);
    }

    function validateProjectDraft(draft) {
      const fields = [];
      fields.push({ key: "intent", label: "创建意图", status: "ok", value: "新项目 / Campaign 层级" });

      if (draft.channel) {
        fields.push({ key: "channel", label: "投放渠道", status: "ok", value: draft.channel });
      } else {
        fields.push({ key: "channel", label: "投放渠道", status: "missing", message: "请先选择 Meta、Google 或 TikTok" });
      }

      const accounts = draft.channel ? getAvailableProjectAccounts(draft.channel) : [];
      if (!draft.channel) {
        fields.push({ key: "account", label: "账户鉴权", status: "missing", message: "选择渠道后再校验可用账户" });
      } else if (!accounts.length) {
        fields.push({ key: "account", label: "账户鉴权", status: "missing", message: `${draft.channel} 尚未完成授权或没有可用广告账户` });
      } else if (!draft.account) {
        fields.push({ key: "account", label: "账户选择", status: "missing", message: "请从已授权账户中选择 1 个用于创建项目" });
      } else {
        fields.push({ key: "account", label: "账户选择", status: "ok", value: `${draft.accountName} (${draft.account})` });
      }

      const projectName = getDraftProjectName(draft);
      fields.push(projectName
        ? { key: "name", label: "项目名称", status: "ok", value: projectName }
        : { key: "name", label: "项目名称", status: "missing", message: "请补充项目名称，或提供产品、国家和渠道用于自动命名" });

      const product = getDraftProduct(draft);
      fields.push(product
        ? { key: "product", label: "产品", status: "ok", value: product }
        : { key: "product", label: "产品", status: "missing", message: "请补充产品或应用名称" });

      fields.push(draft.countries.length
        ? { key: "countries", label: "投放国家", status: "ok", value: draft.countries.join(" / ") }
        : { key: "countries", label: "投放国家", status: "missing", message: "请补充国家或地区，例如美国、北美、东南亚" });

      fields.push(draft.objective
        ? { key: "objective", label: "Campaign Objective", status: "ok", value: draft.objective }
        : { key: "objective", label: "Campaign Objective", status: "missing", message: "请补充注册、安装、付费、ROAS 或流量目标" });

      fields.push(draft.budget
        ? { key: "budget", label: "Budget", status: "ok", value: draft.budget }
        : { key: "budget", label: "Budget", status: "missing", message: "请补充预算，例如日预算 800 美元" });

      return { fields, accounts, canCreate: fields.every(field => field.status === "ok") };
    }

    function getDraftProjectName(draft) {
      if (isMeaningfulProjectValue(draft.name)) return draft.name;
      const product = draft.product;
      if (!product || !draft.channel) return "";
      const country = draft.countries[0] || "Global";
      return `${product} ${country} ${draft.channel} 投放项目`;
    }

    function getDraftProduct(draft) {
      return isMeaningfulProjectValue(draft.product) ? draft.product : "";
    }

    function renderProjectCreationReply(draft, validation, leadingMessage = "") {
      const channel = draft.channel;
      const activeStep = !channel ? 2 : !draft.account ? 3 : validation.canCreate ? 3 : 3;
      return `
        <p><strong>我判断这是创建新项目，不是创建新任务。</strong></p>
        ${leadingMessage ? `<div class="assistant-alert">${escapeHtml(leadingMessage)}</div>` : ""}
        <section class="project-flow-card">
          <h3>新项目创建校验 <span class="project-flow-status">${validation.canCreate ? "可创建" : "等待补充"}</span></h3>
          <div class="project-flow-steps">
            <button class="project-flow-step project-edit-row done ${state.projectEditingField === "intent" ? "active" : ""}" type="button" data-project-edit-field="intent">1. 识别意图<br>新项目 / Campaign</button>
            <button class="project-flow-step project-edit-row ${channel ? "done" : activeStep === 2 ? "active" : ""} ${state.projectEditingField === "channel" ? "active" : ""}" type="button" data-project-edit-field="channel">2. 选择渠道<br>${escapeHtml(channel || "待选择")}</button>
            <button class="project-flow-step project-edit-row ${draft.account ? "done" : activeStep === 3 ? "active" : ""} ${state.projectEditingField === "account" ? "active" : ""}" type="button" data-project-edit-field="account">3. 账户鉴权<br>${escapeHtml(draft.accountName || "待选择账户")}</button>
          </div>
          ${renderProjectValidationFields(validation.fields)}
          ${renderProjectEditPanel(draft, validation)}
          ${renderProjectNextAction(draft, validation)}
          ${renderProjectDraftPreview(draft)}
        </section>
        <p>${escapeHtml(getProjectCreationHint(draft, validation))}</p>
      `;
    }

    function renderProjectValidationFields(fields) {
      return `
        <div class="field-checks">
          ${fields.map(field => `
            <button class="field-check project-edit-row ${field.status} ${state.projectEditingField === field.key ? "active" : ""}" type="button" data-project-edit-field="${escapeHtml(field.key)}">
              <strong>${escapeHtml(field.label)}</strong>
              <b>${escapeHtml(field.value || field.message || "未匹配")}</b>
              <em>${field.status === "ok" ? "通过" : field.status === "invalid" ? "错误" : "待补充"}</em>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderProjectEditPanel(draft, validation) {
      const field = state.projectEditingField;
      if (!field) return "";
      const config = getProjectEditConfig(field, draft, validation);
      if (!config) return "";
      return `
        <section class="project-edit-panel">
          <h4>${escapeHtml(config.title)}</h4>
          <p>${escapeHtml(config.desc)}</p>
          ${config.options?.length ? `
            <div class="assistant-action-row">
              ${config.options.map(option => `
                <button class="mini" type="button" data-project-edit-option="${escapeHtml(field)}" data-project-edit-value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</button>
              `).join("")}
            </div>
          ` : ""}
          ${config.input ? `
            <div class="project-edit-input-row">
              <input data-project-edit-input="${escapeHtml(field)}" value="${escapeHtml(config.input.value || "")}" placeholder="${escapeHtml(config.input.placeholder)}" />
              <button class="mini" type="button" data-save-project-edit="${escapeHtml(field)}">保存</button>
            </div>
          ` : ""}
        </section>
      `;
    }

    function getProjectEditConfig(field, draft, validation) {
      const accounts = draft.channel ? getAvailableProjectAccounts(draft.channel) : [];
      const currentCountries = draft.countries.join(" / ");
      const configs = {
        intent: {
          title: "编辑创建层级",
          desc: "当前按新项目 / Campaign 层级校验；如果要创建计划或任务，可以切换回新任务校验。",
          options: [{ label: "切换为新任务校验", value: "task" }]
        },
        channel: {
          title: "编辑投放渠道",
          desc: "渠道会决定后续账户、Campaign 字段和任务层级字段。切换渠道后需要重新选择账户。",
          options: ["Meta", "Google", "TikTok"].map(item => ({ label: item, value: item }))
        },
        account: {
          title: "编辑账户鉴权",
          desc: draft.channel ? `请选择 1 个已授权的 ${draft.channel} 账户用于创建项目。` : "请先选择投放渠道，再选择对应账户。",
          options: accounts.map(account => ({ label: `${account.name} (${account.id})`, value: account.id }))
        },
        name: {
          title: "编辑项目名称",
          desc: "项目名称必须是明确的业务名称，不能使用“新”“一个项目”等泛词。",
          input: { value: draft.name, placeholder: "例如 Candy Quest 北美 Meta 投放项目" }
        },
        product: {
          title: "编辑产品",
          desc: "填写产品、游戏或应用名称，后续会用于 Campaign 命名和项目归属。",
          input: { value: draft.product, placeholder: "例如 Candy Quest" }
        },
        countries: {
          title: "编辑投放国家",
          desc: "可选择常用地区，也可以手动输入多个国家，使用 /、逗号或顿号分隔。",
          options: ["美国", "美国 / 加拿大", "东南亚", "巴西", "全球"].map(item => ({ label: item, value: item })),
          input: { value: currentCountries, placeholder: "例如 美国 / 加拿大" }
        },
        objective: {
          title: "编辑 Campaign Objective",
          desc: "选择本项目的 Campaign 目标，后续任务会继承该方向做计划字段校验。",
          options: [
            { label: "注册", value: "CompleteRegistration / Leads" },
            { label: "安装", value: "App promotion / Install" },
            { label: "付费", value: "Purchase / Sales" },
            { label: "ROAS", value: "ROAS / Value optimization" },
            { label: "流量", value: "Traffic" }
          ],
          input: { value: draft.objective, placeholder: "例如 CompleteRegistration / Leads" }
        },
        budget: {
          title: "编辑 Budget",
          desc: "填写 Campaign 预算，可直接输入日预算或总预算。",
          options: ["日预算 800 USD", "日预算 1000 USD", "总预算 18000 USD"].map(item => ({ label: item, value: item })),
          input: { value: draft.budget, placeholder: "例如 日预算 800 USD" }
        }
      };
      return configs[field];
    }

    function applyProjectFieldEdit(field, value) {
      if (field === "intent" && value === "task") {
        state.taskFlow = "task";
        state.projectCreation = null;
        state.projectEditingField = "";
        const messages = state.taskMessages || [];
        const lastAssistant = [...messages].reverse().find(message => message.role === "assistant");
        if (lastAssistant) lastAssistant.html = buildTaskReply("创建新任务");
        renderTaskPage();
        return;
      }

      const draft = state.projectCreation || createProjectDraft();
      state.projectCreation = draft;
      const raw = String(value || "").trim();

      if (field === "channel") {
        if (draft.channel !== raw) {
          draft.account = "";
          draft.accountName = "";
          draft.accountType = "";
          draft.connectionId = "";
        }
        draft.channel = raw;
      }
      if (field === "account") {
        const account = getAvailableProjectAccounts(draft.channel).find(item => item.id === raw);
        if (account) applyDraftAccount(draft, account);
      }
      if (field === "name") {
        draft.name = isMeaningfulProjectValue(raw) ? raw : "";
      }
      if (field === "product") {
        draft.product = isMeaningfulProjectValue(raw) ? raw : "";
      }
      if (field === "countries") {
        draft.countries = splitProjectCountries(raw).filter(item => item !== "未配置国家");
      }
      if (field === "objective") {
        draft.objective = raw;
      }
      if (field === "budget") {
        const matched = matchBudget(raw);
        if (matched.status === "ok") {
          draft.budget = matched.value;
        } else if (/^\d+(?:\.\d+)?$/.test(raw)) {
          draft.budget = `日预算 ${raw} USD`;
        } else {
          draft.budget = raw;
        }
      }

      refreshProjectCreationReply();
    }

    function saveProjectEditInput(field) {
      const input = document.querySelector(`[data-project-edit-input='${field}']`);
      applyProjectFieldEdit(field, input?.value || "");

    function generateCampaignName(draft) {
      const channel = draft.channel || "CH";

      return `${product}_${country}_${channel}_Campaign_${mm}${dd}`;

    function buildTaskReply(text) {
      const selectedProjects = getSelectedProjects();
      const channels = detectChannels(text);
      const channelList = channels.length ? channels : ["Meta", "Google", "TikTok"];
      const validations = channelList.map(channel => validateChannelForm(channel, text, selectedProjects));
      const hasIssues = validations.some(item => item.issues.length);

      return `
        <p><strong>${hasIssues ? "我已识别到任务意图，但有字段需要补充或修正。" : "已完成基础任务表单校验，下面是按渠道拆分的创建字段。"}</strong></p>

        ${!selectedProjects.length ? `<div class="assistant-alert">创建新任务前必须匹配至少 1 个项目，最多 99 个。请在输入里写出项目名称，例如 Candy Blast、RPG X 或 Puzzle SEA。</div>` : ""}
        ${!channels.length ? `<div class="assistant-alert">未在输入中识别到投放渠道。请明确选择 Meta、Google、TikTok 中的 1 个或多个渠道；下面先展示三渠道所需字段供你补充。</div>` : ""}
        <div class="validation-summary cols-${Math.min(3, validations.length)}">
          ${validations.map(renderChannelValidation).join("")}
        </div>
        <p>${hasIssues || !selectedProjects.length ? "请直接在对话里补充缺失字段，例如“项目选 Candy Blast，Meta 和 TikTok，目标注册，日预算 800 美元，国家美国”。" : "如果这些字段无误，可以继续输入“确认创建”；如果要调整，直接说要修改的字段即可。"}</p>
      `;
    }

    function getSelectedProjects() {
      const selected = new Set(state.selectedProjects || []);
      return projects.filter(project => selected.has(project.id));
    }

    function mergeSelectedProjects(projectIds) {
      const selected = new Set(state.selectedProjects || []);
      projectIds.forEach(id => {
        if (selected.size < 99) selected.add(id);
      });
      state.selectedProjects = Array.from(selected);
    }

    function matchProjectsFromPrompt(text) {
      const normalized = text.toLowerCase();
      return projects.filter(project => {
        const names = [project.name, project.product, ...project.aliases].map(item => item.toLowerCase());
        return names.some(name => normalized.includes(name));
      });
    }

    function detectChannels(text) {
      const found = [];
      if (/meta|facebook|instagram|fb|脸书/i.test(text)) found.push("Meta");
      if (/google|谷歌|uac|youtube|admob/i.test(text)) found.push("Google");
      if (/tiktok|抖音|tt|spark/i.test(text)) found.push("TikTok");
      return found;
    }

    function validateChannelForm(channel, text, selectedProjects) {
      const activeAccount = state.connections.find(conn => conn.platform === channel && conn.status === "active");
      const fields = channelRequirements[channel].map(rule => {
        const result = rule.extract(text, selectedProjects, activeAccount);
        const status = result.status || (result.value ? "ok" : "missing");
        return { ...rule, ...result, status };
      });
      const issues = fields.filter(field => field.status !== "ok").map(field => field.message || `${field.label} 无法匹配`);
      return { channel, activeAccount, fields, issues };
    }

        id: adsetId,
        name: values.adsetName,
        status: values.status || "Draft",
        conversionLocation: values.conversionLocation,
        pixelAppPage: values.pixelAppPage,
        conversionEvent: values.conversionEvent,
        performanceGoal: values.performanceGoal,
        attribution: values.attribution,
        targeting: values.targeting,
        placements: values.placements,

    function updateMetaTaskConfig(projectId, taskId) {
      const project = projects.find(item => item.id === projectId);
      const task = (project?.tasks || []).find(item => item.id === taskId);
      if (!project || !task) return;
      const values = collectMetaTaskValues();
      const missing = validateRequiredTaskFields(values);
      if (missing.length) {
        showToast(`请先补充：${missing.slice(0, 3).join("、")}${missing.length > 3 ? "等字段" : ""}`);
        return;

      if (!adset) {

        name: values.adsetName,
        status: values.status || "Draft",
        conversionLocation: values.conversionLocation,
        pixelAppPage: values.pixelAppPage,
        conversionEvent: values.conversionEvent,
        performanceGoal: values.performanceGoal,
        attribution: values.attribution,
        targeting: values.targeting,
        placements: values.placements,
        budget: values.budget,
        schedule: values.schedule,

            name: values.adName,
            format: values.adFormat,
            material: values.material,
            copy: values.copy,
            status: values.adStatus || "Draft"

    function clonePlain(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function uniqueId(prefix) {
      return `${prefix}-${Date.now()}-${Math.floor(Math.random() * 9000 + 1000)}`;
    }

    function adjustProjectPlanCount(project, delta) {
      const current = Number.parseInt(project.plans, 10);
      const fallback = (project.adsets || []).length;
      const next = Math.max(0, Number.isFinite(current) ? current + delta : fallback);
      project.plans = `${next} 个计划`;
    }

    function cloneProject(project) {
      const clone = clonePlain(project);
      const suffix = Date.now();
      const adsetMap = new Map();
      clone.id = `${project.id}-copy-${suffix}`;
      clone.name = `${project.name} 复制`;
      clone.aliases = [...(project.aliases || []), `${project.name.toLowerCase()} copy`];
      clone.adsets = (project.adsets || []).map(adset => {
        const next = clonePlain(adset);
        const nextId = uniqueId("plan-copy");
        adsetMap.set(adset.id, nextId);
        next.id = nextId;
        next.name = `${adset.name}_Copy`;
        next.ads = (adset.ads || []).map(ad => ({ ...ad, name: `${ad.name}_Copy` }));
        return next;
      });
      clone.tasks = (project.tasks || []).map(task => ({
        ...clonePlain(task),
        id: uniqueId("task-copy"),
        adsetId: adsetMap.get(task.adsetId) || task.adsetId,
        name: `${task.name} 复制`,
        updatedAt: formatDate(new Date().toISOString())
      }));
      const campaign = clone.campaignConfig || clone.metaCampaign;
      if (campaign) {
        campaign.campaignName = `${campaign.campaignName || project.name}_Copy`;
        campaign.campaignId = "待创建";
      }
      if (clone.channel === "Meta" && clone.campaignConfig) clone.metaCampaign = clone.campaignConfig;
      return clone;
    }

    function copySelectedProjects() {
      const selectedIds = Array.from(document.querySelectorAll("[data-copy-project]:checked")).map(el => el.dataset.copyProject);
      if (!selectedIds.length) {
        showToast("请先选择要复制的项目");
        return;
      }
      const copies = selectedIds.map(id => projects.find(project => project.id === id)).filter(Boolean).map(cloneProject);
      projects.unshift(...copies);
      renderProjectsPage();
      showToast(`已复制 ${copies.length} 个项目`);
    }

    function clonePlanForProject(project, task) {
      const adset = getTaskAdset(project, task);
      const nextTask = clonePlain(task);
      nextTask.id = uniqueId("task-copy");
      nextTask.name = `${task.name} 复制`;
      nextTask.updatedAt = formatDate(new Date().toISOString());
      if (!adset) {
        return { task: nextTask, adset: null };
      }
      const nextAdset = clonePlain(adset);
      nextAdset.id = uniqueId("plan-copy");
      nextAdset.name = `${adset.name}_Copy`;
      nextAdset.ads = (adset.ads || []).map(ad => ({ ...ad, name: `${ad.name}_Copy` }));
      nextTask.adsetId = nextAdset.id;
      nextTask.summary = `复制 ${adset.name}，保留原计划字段和素材配置。`;
      return { task: nextTask, adset: nextAdset };
    }

    function copySelectedPlans(projectId) {
      const project = projects.find(item => item.id === projectId);
      if (!project) return;
      const selectedIds = Array.from(document.querySelectorAll("[data-copy-plan]:checked")).map(el => el.dataset.copyPlan);
      if (!selectedIds.length) {
        showToast("请先选择要复制的计划");
        return;
      }
      const copies = selectedIds.map(id => (project.tasks || []).find(task => task.id === id)).filter(Boolean).map(task => clonePlanForProject(project, task));
      project.adsets = [...(project.adsets || []), ...copies.map(item => item.adset).filter(Boolean)];
      project.tasks = [...(project.tasks || []), ...copies.map(item => item.task)];
      adjustProjectPlanCount(project, copies.length);
      renderProjectsPage();
      showToast(`已复制 ${copies.length} 个计划`);
    }

      const selectedProjects = projects.filter(project => selectedIds.includes(project.id));

        { type: "projects", ids: selectedProjects.map(project => project.id) }
